[tool.isort]
profile = "black"
line_length = 88

# Formatting (100% kompatibel Black)
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Section ordering
sections = [
  "FUTURE",
  "STDLIB",
  "THIRDPARTY",
  "FIRSTPARTY",
  "LOCALFOLDER",
]

lines_between_sections = 1
lines_between_types = 1
order_by_type = true
case_sensitive = false
combine_as_imports = true

# Project structure (WAJIB eksplisit)
known_third_party = [
  "pyrogram",
  "psutil",
  "asyncio",
]

known_first_party = [
  "apps",
  "bots",
  "callback",
  "common",
  "configs",
  "db",
  "handlers",
  "router",
  "usecases",
  "utils",
]

default_section = "LOCALFOLDER"
src_paths = ["."]
skip_gitignore = true

# Safety & determinism
atomic = true
float_to_top = false


[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = false


[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning:pyrogram.*",
]
